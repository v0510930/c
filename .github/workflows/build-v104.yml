name: Build 怪咖定位 v1.0.4 IPA

on:
  push:
    tags:
      - 'v104-build-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: Reloc-v104
        run: xcodegen generate

      - name: Build unsigned device IPA
        working-directory: Reloc-v104
        run: |
          set -e -o pipefail
          mkdir -p build build/Payload
          xcodebuild build \
            -project Reloc.xcodeproj \
            -scheme Reloc \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Reloc.app build/Payload/
          (cd build && zip -qry 怪咖定位.ipa Payload)
          ls -lh build/*.ipa

      - name: Publish IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 怪咖定位 ${{ github.ref_name }}
          files: Reloc-v104/build/怪咖定位.ipa
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish failure log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 怪咖定位 构建失败 ${{ github.ref_name }}
          files: Reloc-v104/build/xcodebuild.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[package]
name = "reloc-device-bridge"
version = "0.1.0"
edition = "2024"

[lib]
name = "reloc_device_bridge"
crate-type = ["staticlib"]

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = ["ring", "remote_pairing", "rsd", "tunnel_tcp_stack"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "time", "net", "sync", "macros", "io-util"] }
serde_json = "1"
plist = "1.8"
base64 = "0.22"
libc = "0.2"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

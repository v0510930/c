name: Reloc
options:
  bundleIdPrefix: dev.reloc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  Reloc:
    type: application
    platform: iOS
    sources:
      - path: Reloc/Core
      - path: Reloc/UI
      - path: Reloc/Resources/Assets.xcassets
      - path: Reloc/Resources/MFi
        buildPhase: resources
        type: folder
    info:
      path: Reloc/Info.plist
      properties:
        CFBundleDisplayName: Reloc
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Reloc 通过本地网络发现这台设备并完成配对，回环由你的外部代理提供。
        NSBonjourServices:
          - _remotepairing-pairable-host._tcp
          - _remotepairing._tcp
        NSLocationWhenInUseUsageDescription: 定位注入期间用于保持 Reloc 在后台运行并触发系统定位服务订阅。
        NSLocationAlwaysAndWhenInUseUsageDescription: 定位注入期间用于保持 Reloc 在后台持续运行并防止系统挂起导致定位失效。
        UIBackgroundModes:
          - location
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reloc.ios
        SWIFT_OBJC_BRIDGING_HEADER: Reloc/Core/ObjC/Reloc-Bridging-Header.h
        INFOPLIST_FILE: Reloc/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - framework: Vendor/RelocDeviceBridge.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
